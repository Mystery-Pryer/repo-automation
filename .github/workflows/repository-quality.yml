name: Reusable Repository Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for validation
        required: false
        type: string
        default: "3.12"
      validator-path:
        description: Repository-relative Python validator path
        required: false
        type: string
        default: scripts/validate_repository.py
      install-requirements:
        description: Install requirements.txt when it exists
        required: false
        type: boolean
        default: true
      artifact-name:
        description: Uploaded validation artifact name
        required: false
        type: string
        default: repository-quality-report
      artifact-path:
        description: Repository-relative report or artifact path
        required: false
        type: string
        default: artifacts/repository-quality-summary.json
      retention-days:
        description: Artifact retention period
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install declared root dependencies
        if: inputs.install-requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run repository validator
        shell: bash
        run: python "${{ inputs.validator-path }}"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
